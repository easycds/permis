
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Auto-École · Places Permis (PP/VM)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sbae:#1a56db;--sbae-light:#ebf2ff;--sbae-dark:#1e3a8a;
  --easy:#FF3030;--easy-light:#fff0f0;--easy-dark:#cc0000;
  --cds:#057a55;--cds-light:#def7ec;--cds-dark:#014737;
  --bg:#f4f6f9;--surface:#ffffff;--border:#e5e7eb;--border-strong:#d1d5db;
  --text:#111827;--text-muted:#6b7280;--text-light:#9ca3af;
  --danger:#dc2626;--danger-light:#fef2f2;
  --warn:#d97706;--warn-light:#fffbeb;
  --ok:#057a55;--ok-light:#def7ec;
  --b78:#7c3aed;--b78-light:#ede9fe;--b78-dark:#4c1d95;
  --radius:10px;--radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
body.dark {
  --bg:#0f1117;--surface:#1a1d27;--border:#2e3347;--border-strong:#3d4461;
  --text:#e8eaf0;--text-muted:#8b92a8;--text-light:#5a6178;
  --sbae-light:#1a2d6e;--sbae-dark:#93b4ff;
  --easy-light:#3a0000;--easy-dark:#ff7070;
  --cds-light:#0d3326;--cds-dark:#6ee7b7;
  --danger-light:#3b0f0f;--warn-light:#2d1f08;--ok-light:#0d3326;
  --b78-light:#2d1f52;--b78-dark:#c4b5fd;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
}
body.dark .topbar{background:#cc0000;box-shadow:0 2px 12px rgba(0,0,0,.4)}
body.dark .nav{background:rgba(0,0,0,.2)}
body.dark .nav-btn.active{background:var(--surface);color:#FF3030}
body.dark select,body.dark input[type="text"],body.dark input[type="date"]{background:var(--surface);color:var(--text);border-color:var(--border)}
body.dark textarea{background:var(--surface);color:var(--text);border-color:var(--border)}
body.dark .exam-group{background:var(--surface)}
body.dark .exam-group-header{background:#12151e}
body.dark table.exam-table th{background:#12151e}
body.dark table.exam-table tr:hover td{background:#22263a}
body.dark .modal{background:var(--surface)}
body.dark .filter-bar{background:var(--surface)}
body.dark .search-bar{background:var(--surface)}
body.dark .search-results{background:var(--surface)}
body.dark .bank-section{background:var(--surface)}
body.dark .add-form{background:#12151e;border-color:var(--border)}
body.dark .drop-col{background:#12151e;border-color:var(--border)}
body.dark .drag-item{background:var(--surface);border-color:var(--border)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#FF3030;border-bottom:none;padding:0 24px;display:flex;align-items:center;gap:16px;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(255,48,48,.35)}
.logo-area{display:flex;align-items:center;gap:12px;flex:1}
#logo-box{width:42px;height:42px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#FF3030;flex-shrink:0;text-align:center;line-height:1.2;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.app-title{font-size:16px;font-weight:700;letter-spacing:-.3px;color:#fff}
.app-sub{font-size:12px;color:rgba(255,255,255,.75);margin-top:1px}
.badges{display:flex;gap:6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge.sbae{background:var(--sbae-light);color:var(--sbae-dark)}
.badge.cds{background:var(--cds-light);color:var(--cds-dark)}
.nav{display:flex;gap:2px;background:rgba(0,0,0,.15);padding:2px;border-radius:var(--radius);margin-right:8px}
.nav-btn{padding:7px 14px;border-radius:8px;border:none;background:none;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;color:rgba(255,255,255,.75);font-weight:500;transition:all .15s;white-space:nowrap}
.nav-btn.active{background:#fff;color:#FF3030;box-shadow:0 1px 4px rgba(0,0,0,.15);font-weight:700}
.nav-btn:hover:not(.active){color:#fff;background:rgba(255,255,255,.15)}
.main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%}
.view{display:none}
.view.active{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px}
.stat-val{font-size:26px;font-weight:600;font-family:'DM Mono',monospace;line-height:1}
.stat-lbl{font-size:12px;color:var(--text-muted);margin-top:4px}
.stat.accent-easy .stat-val{color:var(--easy)}
.stat.accent-ok .stat-val{color:var(--ok)}
.stat.accent-warn .stat-val{color:var(--warn)}
.stat.accent-danger .stat-val{color:var(--danger)}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar-left{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap}
select,input[type="text"],input[type="date"]{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--sbae)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--easy);color:#fff;border-color:var(--easy);font-weight:600}
.btn.primary:hover{background:var(--easy-dark);box-shadow:0 2px 8px rgba(255,48,48,.35)}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav select{font-size:14px;font-weight:600;padding:8px 12px}
.filter-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;margin-bottom:16px;box-shadow:var(--shadow)}
.filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-right:2px}
.chip-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:12px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;transition:all .15s}
.chip-btn:hover{border-color:var(--easy);color:var(--easy)}
.chip-btn.active{background:var(--easy);color:#fff;border-color:var(--easy)}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 6px}
.exam-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.exam-group-header{padding:12px 20px;background:#f9fafb;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:-.2px}
.exam-group-header .date-dot{width:8px;height:8px;border-radius:50%;background:var(--sbae);flex-shrink:0}
.countdown-tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;margin-left:8px}
.ct-future{background:#f0f6ff;color:var(--sbae-dark)}
.ct-soon{background:#fffbeb;color:#78350f}
.ct-urgent{background:var(--danger-light);color:#7f1d1d}
.ct-past{background:#f3f4f6;color:var(--text-muted)}
.ready-tag{margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.ready-tag.all{background:var(--ok-light);color:var(--cds-dark)}
.ready-tag.partial{background:var(--warn-light);color:#78350f}
table.exam-table{width:100%;border-collapse:collapse;table-layout:auto}
table.exam-table th{padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:#fafafa}
table.exam-table td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.exam-table td:last-child{width:36px}
table.exam-table td input[type="text"]{width:100%;min-width:0}
table.exam-table tr:last-child td{border-bottom:none}
table.exam-table tr:hover td{background:#fafafa}
table.exam-table td select,table.exam-table td input{padding:6px 8px;font-size:13px}
.b78-row td{background:var(--b78-light)!important;border-color:#ddd6fe!important}
.b78-row input,.b78-row select{background:transparent!important;border-color:#c4b5fd!important}
.libre-row td{background:var(--warn-light)!important}
.pv-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;border:1px solid;font-size:11px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .12s;user-select:none;letter-spacing:.3px}
.pv-badge:active{transform:scale(.92)}
.pv-badge.ok{background:var(--ok-light);color:var(--cds-dark);border-color:#a7f3d0}
.pv-badge.nok{background:var(--danger-light);color:#7f1d1d;border-color:#fecaca}
.pv-badge.nok:hover{box-shadow:0 0 0 2px #fecaca66}
.pv-badge.ok:hover{box-shadow:0 0 0 2px #a7f3d066}
.pv-badge:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--text-light);border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.icon-btn:hover{background:var(--danger-light);color:var(--danger)}
.heure-btn{padding:6px 4px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text-muted);transition:all .15s;text-align:center}
.heure-btn:hover{border-color:var(--sbae);color:var(--sbae)}
.heure-btn.selected{background:var(--sbae);color:#fff;border-color:var(--sbae);font-weight:600}
.pv-toggle{padding:10px 4px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .15s;text-align:center;color:var(--text-muted)}
.pv-toggle.on{background:var(--ok-light);color:var(--cds-dark);border-color:#a7f3d0}
.pv-toggle.off{background:var(--danger-light);color:#7f1d1d;border-color:#fecaca}
.empty{text-align:center;padding:32px;color:var(--text-muted);font-size:13px}
.empty-icon{font-size:36px;display:block;margin-bottom:8px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-field label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px}
.form-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;width:480px;max-width:95vw;max-height:92vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:300;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
/* ===== BANQUE D'ÉLÈVES ===== */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.search-bar input{flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;background:transparent;color:var(--text)}
.search-bar input::placeholder{color:var(--text-light)}
.search-results{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.search-result-item{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.search-result-item:last-child{border-bottom:none}
.search-empty{padding:24px;text-align:center;color:var(--text-muted);font-size:13px}
.add-form{background:#f9fafb;border:1px dashed var(--border-strong);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px}
textarea{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;resize:vertical;background:var(--surface);color:var(--text);outline:none}
.bank-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.bank-agency-label{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.bank-agency-label.sbae{color:var(--sbae)}
.bank-agency-label.cds{color:var(--cds)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:32px}
.chip-rm{cursor:pointer;font-size:14px;line-height:1;opacity:.5;transition:opacity .15s;margin-left:2px}
.chip-rm:hover{opacity:1;color:var(--danger)}
.drop-col{min-height:120px;background:#fafafa;border:2px dashed var(--border);border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:6px;transition:all .15s}
.drop-col.drag-over{background:#f0f6ff;border-color:var(--sbae)}
.drag-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-weight:500;cursor:grab;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);transition:all .15s}
.drag-item:hover{border-color:var(--sbae)}
.drag-item:active{cursor:grabbing;opacity:.8}
.drag-item.sbae{border-left:3px solid var(--sbae)}
.drag-item.cds{border-left:3px solid var(--cds)}
.drag-item.pending{border-left:3px solid var(--text-light)}
.drag-rm{font-size:12px;color:var(--text-light);cursor:pointer;margin-left:8px}
.drag-rm:hover{color:var(--danger)}
@media(max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .topbar{flex-wrap:wrap;height:auto;padding:10px 16px}
  .main{padding:16px}
  .nav-btn{padding:6px 8px;font-size:11px}
  .exam-group{overflow-x:auto}
  table.exam-table{min-width:820px}
  #drag-grid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>
<div class="shell" id="app-shell">
  <div class="topbar">
    <div class="logo-area">
      <div id="logo-box">easy</div>
      <div>
        <div class="app-title">Easy Auto-École</div>
        <div class="app-sub">Places permis · Suivi PP / VM · Gatignolle</div>
      </div>
      <div class="badges">
        <span class="badge sbae">● SBAE</span>
        <span class="badge cds">● CDS</span>
      </div>
    </div>
    <div class="nav">
      <button class="nav-btn active" id="nb-planning">📋 Planning</button>
      <button class="nav-btn" id="nb-banque">👥 Élèves</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-left:8px">
      <button class="btn" id="btn-dark" style="padding:5px 10px;font-size:14px;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);color:#fff" title="Mode sombre">🌙</button>
    </div>
  </div>

  <div class="main">

    <!-- ===== VUE PLANNING ===== -->
    <div class="view active" id="view-planning">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="month-nav">
            <button class="btn" id="btn-prev-month">‹</button>
            <select id="sel-month"></select>
            <button class="btn" id="btn-next-month">›</button>
          </div>
        </div>
        <button class="btn" id="btn-print" title="Imprimer le planning">🖨️ Imprimer</button>
        <button class="btn primary" id="btn-add-slot">+ Ajouter une place</button>
      </div>
      <div class="stats" id="stats-row"></div>
      <div class="filter-bar" id="filter-bar"></div>
      <div id="planning-content"></div>
    </div>

    <!-- ===== VUE BANQUE D'ÉLÈVES ===== -->
    <div class="view" id="view-banque">
      <div class="toolbar">
        <div class="toolbar-left"><strong style="font-size:15px">Banque d'élèves</strong></div>
        <button class="btn" id="btn-select-all-eleves">☑ Tout sélectionner</button>
        <button class="btn" id="btn-delete-eleves" style="display:none;background:var(--danger);color:#fff;border-color:var(--danger)">🗑 Supprimer</button>
      </div>

      <div class="search-bar">
        <span style="color:var(--text-muted)">🔍</span>
        <input type="text" id="search-eleves" placeholder="Rechercher un élève..." oninput="searchEleves(this.value)">
        <button onclick="clearSearch()" style="border:none;background:none;cursor:pointer;color:var(--text-muted);font-size:18px;padding:0;line-height:1">×</button>
      </div>
      <div id="search-results" style="display:none"></div>

      <!-- Zone import en masse -->
      <div class="add-form">
        <div class="form-row" style="align-items:flex-start">
          <div class="form-field" style="flex:1">
            <label>Coller des noms (un par ligne)</label>
            <textarea id="e-noms" placeholder="Martin Sophie&#10;Dupont Thomas&#10;Leroy Emma&#10;..." rows="4" style="width:100%"></textarea>
          </div>
          <button class="btn primary" id="btn-import-noms" style="align-self:flex-end">Importer</button>
        </div>
      </div>

      <!-- Zone drag & drop de classification -->
      <div id="drag-zone" style="display:none">
        <div id="drag-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px">
          <div>
            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px;padding:8px 12px;background:#f3f4f6;border-radius:var(--radius-sm);text-align:center">
              📋 À classer (<span id="count-pending">0</span>)
            </div>
            <div id="drop-pending" class="drop-col" ondragover="onDragOver(event,this)" ondragleave="this.classList.remove('drag-over')" ondrop="onDrop(event,'pending',this)"></div>
          </div>
          <div>
            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--sbae-dark);margin-bottom:8px;padding:8px 12px;background:var(--sbae-light);border-radius:var(--radius-sm);text-align:center">
              ● SBAE — Doriane / Aline (<span id="count-sbae">0</span>)
            </div>
            <div id="drop-sbae" class="drop-col" ondragover="onDragOver(event,this)" ondragleave="this.classList.remove('drag-over')" ondrop="onDrop(event,'sbae',this)"></div>
          </div>
          <div>
            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--cds-dark);margin-bottom:8px;padding:8px 12px;background:var(--cds-light);border-radius:var(--radius-sm);text-align:center">
              ● CDS — Charles / Grégoire (<span id="count-cds">0</span>)
            </div>
            <div id="drop-cds" class="drop-col" ondragover="onDragOver(event,this)" ondragleave="this.classList.remove('drag-over')" ondrop="onDrop(event,'cds',this)"></div>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:20px">
          <button class="btn" id="btn-cancel-import">Annuler</button>
          <button class="btn primary" id="btn-confirm-import">✓ Enregistrer la classification</button>
        </div>
      </div>

      <!-- Chips existants -->
      <div id="existing-eleves">
        <div class="bank-section">
          <div class="bank-agency-label sbae">● SBAE — Doriane &amp; Aline</div>
          <div class="chips" id="chips-sbae"></div>
        </div>
        <div class="bank-section">
          <div class="bank-agency-label cds">● CDS — Charles &amp; Grégoire</div>
          <div class="chips" id="chips-cds"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL AJOUT PLACE -->
<div class="modal-bg" id="modal-slot" style="display:none">
  <div class="modal">
    <div class="modal-title">📅 Ajouter des places d'examen</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="form-field"><label>Date</label><input type="date" id="ms-date" style="width:100%"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-field"><label>Agence</label>
          <select id="ms-agence" style="width:100%">
            <option value="sbae">SBAE — Doriane / Aline</option>
            <option value="cds" selected>CDS — Charles / Grégoire</option>
          </select>
        </div>
        <div class="form-field"><label>Type de permis</label>
          <select id="ms-permis" style="width:100%">
            <option value="B">B</option>
            <option value="AAC">AAC</option>
            <option value="SUPP">SUPP</option>
            <option value="B78">B78</option>
          </select>
        </div>
      </div>
      <div class="form-field"><label>Moniteur</label>
        <select id="ms-moniteur" style="width:100%">
          <option value="Charles">Charles</option>
          <option value="Grégoire">Grégoire</option>
          <option value="Doriane">Doriane</option>
          <option value="Aline">Aline</option>
        </select>
      </div>
      <div class="form-field"><label>Élève <span style="font-weight:400;text-transform:none;letter-spacing:0">(taper pour chercher dans la banque · vide = place libre)</span></label>
        <input type="text" id="ms-nom" list="dl-ms-noms" placeholder="🔍 Taper le nom..." style="width:100%">
        <datalist id="dl-ms-noms"></datalist>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button type="button" class="pv-toggle off" id="ms-pp" onclick="toggleModalPV('pp')" title="Prépa Permis">PP · À faire</button>
        <button type="button" class="pv-toggle off" id="ms-vm" onclick="toggleModalPV('vm')" title="Vérifications mécaniques int/ext">VM · À faire</button>
      </div>
      <div class="form-field">
        <label>Horaires <span style="font-weight:400;color:var(--text-muted);text-transform:none;letter-spacing:0">(cochez les heures souhaitées)</span></label>
        <div id="ms-heures-grid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-muted)">
        <button onclick="selectAllHeures(true)" style="border:none;background:none;cursor:pointer;color:var(--sbae);font-size:12px;text-decoration:underline;padding:0">Tout sélect.</button>
        <button onclick="selectAllHeures(false)" style="border:none;background:none;cursor:pointer;color:var(--text-muted);font-size:12px;text-decoration:underline;padding:0">Tout déséléct.</button>
        <span id="ms-count-label" style="margin-left:auto;font-weight:600;color:var(--text)"></span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="btn-cancel-slot">Annuler</button>
      <button class="btn primary" id="btn-save-slot">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   EASY AUTO-ÉCOLE · PLACES PERMIS — SUIVI PP / VM + BANQUE D'ÉLÈVES
   Basé sur le design system et les composants de easy-permis.
   Données en mémoire. Pour brancher Supabase : remplacer les fonctions
   marquées "SYNC" par des appels sb.from('slots') / sb.from('eleves').
   Champs supplémentaires vs table 'slots' : pp (bool), vm (bool).
===================================================================== */
var MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
var JOURS_FULL=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var MONITEURS=['Charles','Grégoire','Doriane','Aline'];
var PERMIS=['B','AAC','SUPP','B78'];

var state={
  eleves:{
    sbae:['Le Cleve Gautier','Cordier Damien','Dupont Thomas','Petit Chloé'],
    cds:['Le Goff Savanah','Mesnildrey Bruno','Martin Léa','Leroy Emma','Weber Sarah']
  },
  slots:[
    {id:1,month:'2026-06',date:'2026-06-02',heure:'09:00',agence:'sbae',nom:'Le Cleve Gautier', type_permis:'B',  moniteur:'Grégoire',pp:true, vm:true, commentaire:''},
    {id:2,month:'2026-06',date:'2026-06-02',heure:'09:30',agence:'sbae',nom:'Cordier Damien',  type_permis:'B',  moniteur:'Doriane', pp:true, vm:false,commentaire:''},
    {id:3,month:'2026-06',date:'2026-06-04',heure:'13:30',agence:'cds', nom:'Le Goff Savanah', type_permis:'B',  moniteur:'Grégoire',pp:false,vm:false,commentaire:''},
    {id:4,month:'2026-06',date:'2026-06-04',heure:'14:00',agence:'cds', nom:'Mesnildrey Bruno',type_permis:'B78',moniteur:'Aline',   pp:false,vm:true, commentaire:''},
    {id:5,month:'2026-07',date:'2026-07-07',heure:'08:30',agence:'cds', nom:'Martin Léa',      type_permis:'AAC',moniteur:'Charles', pp:true, vm:true, commentaire:'Boîte auto'},
    {id:6,month:'2026-07',date:'2026-07-07',heure:'09:00',agence:'sbae',nom:'',                type_permis:'B',  moniteur:'Charles', pp:false,vm:false,commentaire:''}
  ],
  nextId:7,
  currentMonth:'',
  filtreMoniteur:'',
  filtreStatut:'' // '' | 'ok' | 'incomplet'
};
var modalPV={pp:false,vm:false};
var dragState={items:[],draggedNom:null};

function toast(msg,col){var t=document.getElementById('toast');t.textContent=msg;t.style.background=col||'#111827';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function estComplet(s){return s.pp&&s.vm;}
function estAffecte(s){return !!(s.nom&&s.nom.trim());}
function tousEleves(){
  return state.eleves.sbae.map(function(n){return{n:n,a:'sbae'};})
    .concat(state.eleves.cds.map(function(n){return{n:n,a:'cds'};}));
}
function agenceDe(nom){
  if(state.eleves.sbae.includes(nom))return 'sbae';
  if(state.eleves.cds.includes(nom))return 'cds';
  return null;
}

/* ===== DARK MODE ===== */
function toggleDark(){
  var dark=document.body.classList.toggle('dark');
  document.getElementById('btn-dark').textContent=dark?'☀️':'🌙';
  try{localStorage.setItem('permis_pv_dark',dark?'1':'0');}catch(e){}
}
function initDark(){
  try{if(localStorage.getItem('permis_pv_dark')==='1'){document.body.classList.add('dark');document.getElementById('btn-dark').textContent='☀️';}}catch(e){}
}

/* ===== VUES ===== */
function showView(v){
  document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(x){x.classList.remove('active');});
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nb-'+v).classList.add('active');
  if(v==='planning')renderPlanning();
  if(v==='banque')renderBanque();
}

/* ===== MOIS ===== */
function initMonth(){var now=new Date();state.currentMonth=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');}
function buildMonthSel(){
  var sel=document.getElementById('sel-month');sel.innerHTML='';
  var now=new Date();
  for(var i=-3;i<=9;i++){
    var d=new Date(now.getFullYear(),now.getMonth()+i,1);
    var val=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var opt=document.createElement('option');opt.value=val;opt.textContent=MONTHS[d.getMonth()]+' '+d.getFullYear();
    if(val===state.currentMonth)opt.selected=true;sel.appendChild(opt);
  }
}
function shiftMonth(delta){var p=state.currentMonth.split('-').map(Number);var d=new Date(p[0],p[1]-1+delta,1);state.currentMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');buildMonthSel();renderPlanning();}

/* ===== FILTRES ===== */
function setFiltre(cle,val){state[cle]=val;renderPlanning();}
function renderFilters(){
  var html='<span class="filter-label">👤 Moniteur</span>';
  html+='<button class="chip-btn'+(state.filtreMoniteur===''?' active':'')+'" onclick="setFiltre(\'filtreMoniteur\',\'\')">Tous</button>';
  MONITEURS.forEach(function(m){
    html+='<button class="chip-btn'+(state.filtreMoniteur===m?' active':'')+'" onclick="setFiltre(\'filtreMoniteur\',\''+m+'\')">'+m+'</button>';
  });
  html+='<div class="filter-sep"></div><span class="filter-label">Statut</span>';
  html+='<button class="chip-btn'+(state.filtreStatut===''?' active':'')+'" onclick="setFiltre(\'filtreStatut\',\'\')">Tous</button>';
  html+='<button class="chip-btn'+(state.filtreStatut==='ok'?' active':'')+'" onclick="setFiltre(\'filtreStatut\',\'ok\')">✓ Prêts</button>';
  html+='<button class="chip-btn'+(state.filtreStatut==='incomplet'?' active':'')+'" onclick="setFiltre(\'filtreStatut\',\'incomplet\')">⚠ Incomplets</button>';
  document.getElementById('filter-bar').innerHTML=html;
}

/* ===== STATS (KPIs) ===== */
function renderStats(ms){
  var total=ms.length;
  var affectes=ms.filter(estAffecte);
  var libres=total-affectes.length;
  var ppManquant=affectes.filter(function(s){return !s.pp;}).length;
  var vmManquant=affectes.filter(function(s){return !s.vm;}).length;
  var prets=affectes.filter(estComplet).length;
  var pct=affectes.length?Math.round(prets/affectes.length*100):0;
  document.getElementById('stats-row').innerHTML=
    '<div class="stat"><div class="stat-val">'+total+'</div><div class="stat-lbl">Places examen</div></div>'+
    '<div class="stat accent-easy"><div class="stat-val">'+affectes.length+'</div><div class="stat-lbl">Élèves affectés</div></div>'+
    '<div class="stat '+(libres?'accent-warn':'')+'"><div class="stat-val">'+libres+'</div><div class="stat-lbl">Places libres</div></div>'+
    '<div class="stat '+(ppManquant?'accent-danger':'accent-ok')+'"><div class="stat-val">'+ppManquant+'</div><div class="stat-lbl">PP à faire (Prépa Permis)</div></div>'+
    '<div class="stat '+(vmManquant?'accent-danger':'accent-ok')+'"><div class="stat-val">'+vmManquant+'</div><div class="stat-lbl">VM à faire (Vérifs mécaniques)</div></div>'+
    '<div class="stat '+(pct>=80?'accent-ok':pct>=50?'accent-warn':'accent-danger')+'"><div class="stat-val">'+pct+'%</div><div class="stat-lbl">Élèves prêts (PP + VM ✓)</div></div>';
}

/* ===== PLANNING ===== */
function renderPlanning(){
  state.currentMonth=document.getElementById('sel-month').value;
  var ms=state.slots.filter(function(s){return s.month===state.currentMonth;});
  renderStats(ms);
  renderFilters();

  var liste=ms.filter(function(s){
    if(state.filtreMoniteur&&s.moniteur!==state.filtreMoniteur)return false;
    if(state.filtreStatut==='ok'&&!(estAffecte(s)&&estComplet(s)))return false;
    if(state.filtreStatut==='incomplet'&&estAffecte(s)&&estComplet(s))return false;
    return true;
  });

  if(!liste.length){
    document.getElementById('planning-content').innerHTML='<div class="empty"><span class="empty-icon">📅</span>Aucune place ne correspond '+(ms.length?'à ces filtres':'à ce mois')+'.<br>Cliquez sur <strong>+ Ajouter une place</strong> ou changez les filtres.</div>';
    return;
  }

  var today=new Date();today.setHours(0,0,0,0);
  var byDate={};liste.forEach(function(s){if(!byDate[s.date])byDate[s.date]=[];byDate[s.date].push(s);});
  var html='';
  Object.keys(byDate).sort().forEach(function(d){
    var day=new Date(d+'T12:00:00');var diff=Math.round((day-today)/86400000);
    var label=JOURS_FULL[day.getDay()]+' '+day.getDate()+' '+MONTHS[day.getMonth()]+' '+day.getFullYear();
    var ctag,ctxt;
    if(diff<0){ctag='ct-past';ctxt='Passé';}else if(diff===0){ctag='ct-urgent';ctxt="Aujourd'hui !";}else if(diff<=3){ctag='ct-urgent';ctxt='J-'+diff+' ⚠';}else if(diff<=7){ctag='ct-soon';ctxt='J-'+diff;}else{ctag='ct-future';ctxt='Dans '+diff+'j';}
    var jour=byDate[d];
    var affJour=jour.filter(estAffecte);
    var pretsJour=affJour.filter(estComplet).length;
    var readyCls=(affJour.length&&pretsJour===affJour.length)?'all':'partial';
    html+='<div class="exam-group"><div class="exam-group-header"><div class="date-dot"></div>'+label+'<span class="countdown-tag '+ctag+'">'+ctxt+'</span>';
    html+='<span class="ready-tag '+readyCls+'">'+pretsJour+'/'+affJour.length+' prêt'+(affJour.length>1?'s':'')+'</span>';
    html+='<span style="margin-left:10px;font-size:11px;color:var(--text-muted)">'+jour.length+' place'+(jour.length>1?'s':'')+'</span></div>';
    html+='<table class="exam-table"><thead><tr><th style="width:95px">Heure</th><th style="width:80px">Agence</th><th>Élève</th><th style="width:80px">Catégorie</th><th style="width:110px">Moniteur</th><th style="width:150px">PP · VM</th><th style="min-width:90px">Commentaire</th><th></th></tr></thead><tbody>';

    // Élèves déjà planifiés ce mois (pour ne pas les proposer 2x)
    var plannedThisMonth=state.slots.filter(function(x){return estAffecte(x)&&x.month===state.currentMonth;}).map(function(x){return x.nom;});

    jour.slice().sort(function(a,b){return a.heure.localeCompare(b.heure);}).forEach(function(s){
      var heureOpts='';for(var h=8;h<=16;h++){['00','30'].forEach(function(mn){var v=String(h).padStart(2,'0')+':'+mn;heureOpts+='<option value="'+v+'"'+(s.heure===v?' selected':'')+'>'+v+'</option>';});}
      var permisOpts=PERMIS.map(function(p){return'<option value="'+p+'"'+(s.type_permis===p?' selected':'')+'>'+p+'</option>';}).join('');
      var monOpts=MONITEURS.map(function(m){return'<option value="'+m+'"'+(s.moniteur===m?' selected':'')+'>'+m+'</option>';}).join('');
      var rowCls=s.type_permis==='B78'?'b78-row':(!estAffecte(s)?'libre-row':'');
      var affecte=estAffecte(s);
      // Datalist : banque d'élèves, sans ceux déjà planifiés ce mois (sauf l'élève de cette ligne)
      var dlId='dl_'+s.id;
      var dlOpts='';
      tousEleves().forEach(function(e){
        if(plannedThisMonth.includes(e.n)&&e.n!==s.nom)return;
        dlOpts+='<option value="'+e.n+'">'+e.a.toUpperCase()+'</option>';
      });
      html+='<tr class="'+rowCls+'">';
      html+='<td><select onchange="updateSlot('+s.id+',\'heure\',this.value)" style="width:82px">'+heureOpts+'</select></td>';
      html+='<td><span class="badge '+s.agence+'">'+s.agence.toUpperCase()+'</span></td>';
      html+='<td><input type="text" list="'+dlId+'" value="'+(s.nom||'').replace(/"/g,'&quot;')+'" placeholder="🔍 Chercher un élève..." onchange="updateSlotEleve('+s.id+',this.value)" style="min-width:180px"><datalist id="'+dlId+'">'+dlOpts+'</datalist></td>';
      html+='<td><select onchange="updateSlot('+s.id+',\'type_permis\',this.value)" style="width:70px">'+permisOpts+'</select></td>';
      html+='<td><select onchange="updateSlot('+s.id+',\'moniteur\',this.value)" style="width:100px">'+monOpts+'</select></td>';
      html+='<td style="white-space:nowrap">';
      html+='<button class="pv-badge '+(s.pp?'ok':'nok')+'" onclick="togglePV('+s.id+',\'pp\')" title="Prépa Permis — cliquer pour basculer"'+(affecte?'':' disabled')+'>PP '+(s.pp?'✓':'✗')+'</button> ';
      html+='<button class="pv-badge '+(s.vm?'ok':'nok')+'" onclick="togglePV('+s.id+',\'vm\')" title="Vérifications mécaniques int/ext — cliquer pour basculer"'+(affecte?'':' disabled')+'>VM '+(s.vm?'✓':'✗')+'</button>';
      html+='</td>';
      html+='<td><input type="text" value="'+(s.commentaire||'').replace(/"/g,'&quot;')+'" placeholder="Note..." onchange="updateSlot('+s.id+',\'commentaire\',this.value)" style="width:100%;font-size:12px;box-sizing:border-box"></td>';
      html+='<td class="del-cell" style="text-align:center"><button class="icon-btn" onclick="delSlot('+s.id+')" title="Supprimer">🗑</button></td>';
      html+='</tr>';
    });
    html+='</tbody></table></div>';
  });
  document.getElementById('planning-content').innerHTML=html;
}

/* ===== ACTIONS PLANNING — SYNC : remplacer par sb.from('slots')... si Supabase ===== */
function updateSlot(id,f,v){
  var s=state.slots.find(function(x){return x.id===id;});
  if(!s)return;
  s[f]=v;
  renderPlanning();
  toast('Sauvegardé ✓','#057a55');
}
function updateSlotEleve(id,val){
  var s=state.slots.find(function(x){return x.id===id;});
  if(!s)return;
  val=val.trim();
  s.nom=val;
  var ag=agenceDe(val);
  if(ag)s.agence=ag; // l'agence suit automatiquement l'élève de la banque
  if(!val){s.pp=false;s.vm=false;} // place redevenue libre
  renderPlanning();
  toast(val?(val+' affecté ✓'):'Place libérée','#057a55');
}
function togglePV(id,champ){
  var s=state.slots.find(function(x){return x.id===id;});
  if(!s||!estAffecte(s))return;
  s[champ]=!s[champ];
  renderPlanning();
  toast((champ==='pp'?'Prépa Permis':'Vérif Mécanique')+' : '+(s[champ]?'validé ✓':'à faire ✗'),s[champ]?'#057a55':'#d97706');
}
function delSlot(id){
  if(!confirm('Supprimer cette place ?'))return;
  state.slots=state.slots.filter(function(s){return s.id!==id;});
  renderPlanning();
  toast('Supprimé','#6b7280');
}

/* ===== BANQUE D'ÉLÈVES — SYNC : remplacer par sb.from('eleves')... si Supabase ===== */
function renderBanque(){
  ['sbae','cds'].forEach(function(ag){
    var el=document.getElementById('chips-'+ag);
    if(!state.eleves[ag].length){el.innerHTML='<span style="font-size:13px;color:var(--text-muted)">Aucun élève</span>';return;}
    var html='';
    state.eleves[ag].slice().sort(function(a,b){return a.localeCompare(b,'fr');}).forEach(function(n){
      var color=ag==='sbae'?'background:var(--sbae-light);color:var(--sbae-dark);border-color:#bfdbfe':'background:var(--cds-light);color:var(--cds-dark);border-color:#a7f3d0';
      var accent=ag==='sbae'?'var(--sbae)':'var(--cds)';
      var planifie=state.slots.some(function(s){return s.nom===n&&s.month===state.currentMonth;});
      html+='<label style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid;cursor:pointer;'+color+'">';
      html+='<input type="checkbox" class="eleve-check" data-ag="'+ag+'" data-nom="'+n.replace(/"/g,'&quot;')+'" style="cursor:pointer;accent-color:'+accent+'" onchange="updateDeleteBtn()"> ';
      html+=n;
      if(planifie)html+=' <span title="Planifié ce mois" style="font-size:11px">📋</span>';
      html+='<span class="chip-rm" data-ag="'+ag+'" data-nom="'+n.replace(/"/g,'&quot;')+'" title="Supprimer">×</span>';
      html+='</label>';
    });
    el.innerHTML=html;
  });
  updateDeleteBtn();
}
function updateDeleteBtn(){
  var checked=document.querySelectorAll('.eleve-check:checked');
  var btn=document.getElementById('btn-delete-eleves');
  if(!btn)return;
  if(checked.length>0){
    btn.style.display='inline-flex';
    btn.textContent='🗑 Supprimer ('+checked.length+')';
  } else {
    btn.style.display='none';
  }
}
function deleteSelectedEleves(){
  var checked=document.querySelectorAll('.eleve-check:checked');
  if(!checked.length)return;
  var toDelete=Array.from(checked).map(function(cb){return{nom:cb.getAttribute('data-nom'),ag:cb.getAttribute('data-ag')};});
  if(!confirm('Supprimer '+toDelete.length+' élève'+(toDelete.length>1?'s':'')+' de la banque ?'))return;
  toDelete.forEach(function(d){
    state.eleves[d.ag]=state.eleves[d.ag].filter(function(n){return n!==d.nom;});
  });
  renderBanque();
  toast(toDelete.length+' élève'+(toDelete.length>1?'s':'')+' supprimé'+(toDelete.length>1?'s':'')+' ✓','#6b7280');
}

/* ===== RECHERCHE DANS LA BANQUE ===== */
function searchEleves(q){
  var res=document.getElementById('search-results');
  if(!q.trim()){res.style.display='none';document.getElementById('existing-eleves').style.display='block';return;}
  document.getElementById('existing-eleves').style.display='none';
  q=q.toLowerCase();
  var found=tousEleves().filter(function(e){return e.n.toLowerCase().includes(q);});
  if(!found.length){res.innerHTML='<div class="search-empty">Aucun élève trouvé pour "'+q+'"</div>';res.style.display='block';return;}
  var html='<div style="padding:8px 16px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">'+found.length+' résultat'+(found.length>1?'s':'')+'</div>';
  found.forEach(function(e){
    var slot=state.slots.find(function(s){return s.nom===e.n&&s.month===state.currentMonth;});
    html+='<div class="search-result-item"><span class="badge '+e.a+'">'+e.a.toUpperCase()+'</span><span style="font-weight:500;flex:1">'+e.n+'</span>';
    if(slot){
      var d=new Date(slot.date+'T12:00:00');
      html+='<span style="font-size:11px;background:#f0f6ff;color:var(--sbae);padding:2px 8px;border-radius:10px">📋 '+d.getDate()+' '+MONTHS[d.getMonth()]+' · '+slot.heure+'</span>';
      html+='<span class="pv-badge '+(slot.pp?'ok':'nok')+'" style="cursor:default">PP '+(slot.pp?'✓':'✗')+'</span>';
      html+='<span class="pv-badge '+(slot.vm?'ok':'nok')+'" style="cursor:default">VM '+(slot.vm?'✓':'✗')+'</span>';
    } else {
      html+='<span style="font-size:11px;color:var(--text-light)">Non planifié ce mois</span>';
    }
    html+='</div>';
  });
  res.innerHTML=html;res.style.display='block';
}
function clearSearch(){document.getElementById('search-eleves').value='';searchEleves('');}

/* ===== IMPORT EN MASSE + DRAG & DROP ===== */
function importNoms(){
  var raw=document.getElementById('e-noms').value;
  var noms=raw.split('\n').map(function(n){return n.trim();}).filter(function(n){return n.length>0;});
  if(!noms.length)return;
  // dédoublonner la saisie elle-même
  noms=noms.filter(function(n,i){return noms.indexOf(n)===i;});
  var allExisting=state.eleves.sbae.concat(state.eleves.cds);
  noms=noms.filter(function(n){return !allExisting.includes(n);});
  if(!noms.length){toast('Ces élèves existent déjà','#d97706');return;}
  dragState.items=noms.map(function(n){return{nom:n,agence:'pending'};});
  document.getElementById('drag-zone').style.display='block';
  document.getElementById('existing-eleves').style.display='none';
  document.getElementById('e-noms').value='';
  renderDragZone();
}
function renderDragZone(){
  ['pending','sbae','cds'].forEach(function(col){
    var el=document.getElementById('drop-'+col);
    var items=dragState.items.filter(function(x){return x.agence===col;});
    document.getElementById('count-'+col).textContent=items.length;
    if(!items.length){
      el.innerHTML='<div style="text-align:center;color:var(--text-light);font-size:12px;padding:16px">Glisser ici</div>';
      return;
    }
    var html='';
    items.forEach(function(it){
      html+='<div class="drag-item '+col+'" draggable="true" data-nom="'+it.nom.replace(/"/g,'&quot;')+'" ondragstart="onDragStart(event)">';
      html+='<span>'+it.nom+'</span>';
      html+='<span class="drag-rm" data-nom="'+it.nom.replace(/"/g,'&quot;')+'" title="Retirer de l\'import">×</span>';
      html+='</div>';
    });
    el.innerHTML=html;
  });
}
function onDragStart(e){
  dragState.draggedNom=e.target.getAttribute('data-nom');
  e.dataTransfer.effectAllowed='move';
}
function onDragOver(e,el){
  e.preventDefault();
  el.classList.add('drag-over');
}
function onDrop(e,col,el){
  e.preventDefault();
  el.classList.remove('drag-over');
  var nom=dragState.draggedNom;
  if(!nom)return;
  var item=dragState.items.find(function(x){return x.nom===nom;});
  if(item)item.agence=col;
  dragState.draggedNom=null;
  renderDragZone();
}
function confirmImport(){
  var classified=dragState.items.filter(function(x){return x.agence!=='pending';});
  if(!classified.length){toast('Classez au moins un élève (glisser dans SBAE ou CDS)','#d97706');return;}
  classified.forEach(function(x){
    if(!state.eleves[x.agence].includes(x.nom))state.eleves[x.agence].push(x.nom);
  });
  var restants=dragState.items.filter(function(x){return x.agence==='pending';});
  dragState.items=restants;
  if(restants.length){
    renderDragZone();
    toast(classified.length+' importé'+(classified.length>1?'s':'')+' — '+restants.length+' encore à classer','#d97706');
  } else {
    document.getElementById('drag-zone').style.display='none';
    document.getElementById('existing-eleves').style.display='block';
    toast(classified.length+' élève'+(classified.length>1?'s':'')+' ajouté'+(classified.length>1?'s':'')+' ✓','#057a55');
  }
  renderBanque();
}
function cancelImport(){
  dragState.items=[];
  document.getElementById('drag-zone').style.display='none';
  document.getElementById('existing-eleves').style.display='block';
  document.getElementById('e-noms').value='';
}

/* ===== MODAL AJOUT PLACE ===== */
function buildHeuresGrid(){
  var html='';
  for(var h=8;h<=16;h++){
    ['00','30'].forEach(function(mn){
      var v=String(h).padStart(2,'0')+':'+mn;
      html+='<button type="button" class="heure-btn" data-heure="'+v+'" onclick="toggleHeure(this)">'+v+'</button>';
    });
  }
  document.getElementById('ms-heures-grid').innerHTML=html;
  updateHeuresCount();
}
function toggleHeure(btn){btn.classList.toggle('selected');updateHeuresCount();}
function selectAllHeures(sel){
  document.querySelectorAll('.heure-btn').forEach(function(b){if(sel)b.classList.add('selected');else b.classList.remove('selected');});
  updateHeuresCount();
}
function updateHeuresCount(){
  var n=document.querySelectorAll('.heure-btn.selected').length;
  document.getElementById('ms-count-label').textContent=n===0?'Aucune heure':n+' place'+(n>1?'s':'')+' sélectionnée'+(n>1?'s':'');
}
function toggleModalPV(champ){
  modalPV[champ]=!modalPV[champ];
  var el=document.getElementById('ms-'+champ);
  el.className='pv-toggle '+(modalPV[champ]?'on':'off');
  el.textContent=champ.toUpperCase()+(modalPV[champ]?' ✓ OK':' · À faire');
}
function openAddSlot(){
  document.getElementById('ms-date').value=state.currentMonth+'-01';
  document.getElementById('ms-nom').value='';
  // Datalist : banque d'élèves non planifiés ce mois
  var dl=document.getElementById('dl-ms-noms');
  dl.innerHTML='';
  var planned=state.slots.filter(function(x){return estAffecte(x)&&x.month===state.currentMonth;}).map(function(x){return x.nom;});
  tousEleves().forEach(function(e){
    if(planned.includes(e.n))return;
    var opt=document.createElement('option');opt.value=e.n;opt.textContent=e.a.toUpperCase();dl.appendChild(opt);
  });
  modalPV={pp:false,vm:false};
  document.getElementById('ms-pp').className='pv-toggle off';document.getElementById('ms-pp').textContent='PP · À faire';
  document.getElementById('ms-vm').className='pv-toggle off';document.getElementById('ms-vm').textContent='VM · À faire';
  buildHeuresGrid();
  document.getElementById('modal-slot').style.display='flex';
}
function saveSlot(){
  var date=document.getElementById('ms-date').value;
  if(!date){alert('Veuillez choisir une date.');return;}
  var heures=Array.from(document.querySelectorAll('.heure-btn.selected')).map(function(b){return b.getAttribute('data-heure');});
  if(!heures.length){alert('Sélectionnez au moins une heure.');return;}
  var agence=document.getElementById('ms-agence').value;
  var permis=document.getElementById('ms-permis').value;
  var moniteur=document.getElementById('ms-moniteur').value;
  var nom=document.getElementById('ms-nom').value.trim();
  var ag=agenceDe(nom);
  if(ag)agence=ag; // l'agence suit l'élève de la banque
  var month=date.substring(0,7);
  heures.forEach(function(h,i){
    // Si un élève est saisi, il n'occupe que la 1re heure ; les suivantes sont libres
    var nomLigne=(i===0)?nom:'';
    state.slots.push({id:state.nextId++,month:month,date:date,heure:h,agence:agence,nom:nomLigne,type_permis:permis,moniteur:moniteur,pp:nomLigne?modalPV.pp:false,vm:nomLigne?modalPV.vm:false,commentaire:''});
  });
  closeModal('modal-slot');
  state.currentMonth=month;buildMonthSel();
  renderPlanning();
  toast(heures.length+' place'+(heures.length>1?'s':'')+' ajoutée'+(heures.length>1?'s':'')+' ✓','#057a55');
}
function closeModal(id){document.getElementById(id).style.display='none';}
document.querySelectorAll('.modal-bg').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)m.style.display='none';});});

/* ===== IMPRESSION ===== */
function printPlanning(){
  var month=state.currentMonth;
  var parts=month.split('-').map(Number);
  var monthLabel=MONTHS[parts[1]-1]+' '+parts[0];
  var ms=state.slots.filter(function(s){return s.month===month;});
  if(!ms.length){toast('Aucune place ce mois','#d97706');return;}
  var byDate={};ms.forEach(function(s){if(!byDate[s.date])byDate[s.date]=[];byDate[s.date].push(s);});

  var html='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Planning '+monthLabel+'</title><style>';
  html+='body{font-family:Arial,sans-serif;font-size:13px;color:#111;padding:20px;max-width:900px;margin:0 auto}';
  html+='.header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid #e5e7eb}';
  html+='.header h1{font-size:20px;margin:0}.header p{font-size:12px;color:#6b7280;margin:2px 0 0}';
  html+='.logo{width:56px;height:56px;border-radius:8px;background:#FF3030;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}';
  html+='.date-title{font-size:14px;font-weight:700;padding:8px 12px;background:#f3f4f6;border-radius:6px;margin:20px 0 8px;border-left:4px solid #FF3030}';
  html+='table{width:100%;border-collapse:collapse}th{padding:7px 10px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;color:#6b7280;border-bottom:2px solid #e5e7eb;background:#fafafa}';
  html+='td{padding:8px 10px;border-bottom:1px solid #f3f4f6;vertical-align:middle}';
  html+='.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}';
  html+='.sbae{background:#ebf2ff;color:#1e3a8a}.cds{background:#def7ec;color:#014737}';
  html+='.pv{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;margin-right:4px}';
  html+='.pv.ok{background:#def7ec;color:#014737}.pv.nok{background:#fef2f2;color:#7f1d1d}';
  html+='.cat{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:#f3f4f6}.b78{background:#ede9fe;color:#4c1d95}';
  html+='.libre{color:#9ca3af;font-style:italic}';
  html+='</style></head><body>';
  html+='<div class="header"><div class="logo">easy</div><div><h1>Easy Auto-École — Places permis · PP / VM</h1><p>'+monthLabel+' · Centre Gatignolle</p></div>';
  html+='<div style="margin-left:auto;font-size:12px;color:#6b7280">Imprimé le '+new Date().toLocaleDateString('fr-FR')+'</div></div>';

  var affectes=ms.filter(estAffecte);
  var ppM=affectes.filter(function(s){return !s.pp;}).length;
  var vmM=affectes.filter(function(s){return !s.vm;}).length;
  html+='<div style="display:flex;gap:16px;margin-bottom:8px">';
  [[ms.length,'Places','#f0f6ff','#1a56db'],[affectes.length,'Affectés','#fff0f0','#FF3030'],[ms.length-affectes.length,'Libres','#fffbeb','#d97706'],[ppM,'PP à faire','#fef2f2','#dc2626'],[vmM,'VM à faire','#fef2f2','#dc2626']].forEach(function(k){
    html+='<div style="padding:10px 16px;background:'+k[2]+';border-radius:8px;text-align:center"><div style="font-size:22px;font-weight:700;color:'+k[3]+'">'+k[0]+'</div><div style="font-size:11px;color:#6b7280">'+k[1]+'</div></div>';
  });
  html+='</div>';

  Object.keys(byDate).sort().forEach(function(d){
    var day=new Date(d+'T12:00:00');
    var label=JOURS_FULL[day.getDay()]+' '+day.getDate()+' '+MONTHS[day.getMonth()]+' '+day.getFullYear();
    html+='<div class="date-title">📅 '+label+' — '+byDate[d].length+' place'+(byDate[d].length>1?'s':'')+'</div>';
    html+='<table><thead><tr><th>Heure</th><th>Agence</th><th>Élève</th><th>Catégorie</th><th>Moniteur</th><th>PP</th><th>VM</th><th>Commentaire</th></tr></thead><tbody>';
    byDate[d].slice().sort(function(a,b){return a.heure.localeCompare(b.heure);}).forEach(function(s){
      html+='<tr>';
      html+='<td style="font-weight:600;font-family:monospace">'+s.heure+'</td>';
      html+='<td><span class="badge '+s.agence+'">'+s.agence.toUpperCase()+'</span></td>';
      html+='<td>'+(s.nom||'<span class="libre">Libre</span>')+'</td>';
      html+='<td><span class="cat '+(s.type_permis==='B78'?'b78':'')+'">'+(s.type_permis||'B')+'</span></td>';
      html+='<td>'+(s.moniteur||'—')+'</td>';
      html+='<td>'+(estAffecte(s)?'<span class="pv '+(s.pp?'ok':'nok')+'">'+(s.pp?'✓':'✗')+'</span>':'—')+'</td>';
      html+='<td>'+(estAffecte(s)?'<span class="pv '+(s.vm?'ok':'nok')+'">'+(s.vm?'✓':'✗')+'</span>':'—')+'</td>';
      html+='<td style="color:#6b7280;font-size:12px">'+(s.commentaire||'—')+'</td>';
      html+='</tr>';
    });
    html+='</tbody></table>';
  });
  html+='<div style="margin-top:24px;padding-top:12px;border-top:1px solid #e5e7eb;font-size:11px;color:#9ca3af;text-align:center">Easy Auto-École · easy-permis · PP = Prépa Permis · VM = Vérifications mécaniques · Document généré automatiquement</div>';
  html+='</body></html>';

  var w=window.open('','_blank','width=900,height=700');
  w.document.write(html);
  w.document.close();
  setTimeout(function(){w.print();},500);
}

/* ===== DÉLÉGATION DE CLICS (suppression chip / retrait item drag) ===== */
document.addEventListener('click',function(e){
  if(e.target.classList.contains('chip-rm')){
    e.preventDefault();
    var ag=e.target.getAttribute('data-ag');var nom=e.target.getAttribute('data-nom');
    if(confirm('Supprimer '+nom+' de la banque ?')){
      state.eleves[ag]=state.eleves[ag].filter(function(n){return n!==nom;});
      renderBanque();
      toast('Supprimé','#6b7280');
    }
  }
  if(e.target.classList.contains('drag-rm')){
    var nom=e.target.getAttribute('data-nom');
    dragState.items=dragState.items.filter(function(x){return x.nom!==nom;});
    renderDragZone();
  }
});

/* ===== BINDINGS ===== */
document.getElementById('nb-planning').addEventListener('click',function(){showView('planning');});
document.getElementById('nb-banque').addEventListener('click',function(){showView('banque');});
document.getElementById('btn-prev-month').addEventListener('click',function(){shiftMonth(-1);});
document.getElementById('btn-next-month').addEventListener('click',function(){shiftMonth(1);});
document.getElementById('sel-month').addEventListener('change',renderPlanning);
document.getElementById('btn-print').addEventListener('click',printPlanning);
document.getElementById('btn-add-slot').addEventListener('click',openAddSlot);
document.getElementById('btn-cancel-slot').addEventListener('click',function(){closeModal('modal-slot');});
document.getElementById('btn-save-slot').addEventListener('click',saveSlot);
document.getElementById('btn-dark').addEventListener('click',toggleDark);
document.getElementById('btn-import-noms').addEventListener('click',importNoms);
document.getElementById('btn-confirm-import').addEventListener('click',confirmImport);
document.getElementById('btn-cancel-import').addEventListener('click',cancelImport);
document.getElementById('btn-delete-eleves').addEventListener('click',deleteSelectedEleves);
document.getElementById('btn-select-all-eleves').addEventListener('click',function(){
  var all=document.querySelectorAll('.eleve-check');
  var allChecked=Array.from(all).every(function(cb){return cb.checked;});
  all.forEach(function(cb){cb.checked=!allChecked;});
  updateDeleteBtn();
});

/* ===== INIT ===== */
initDark();
initMonth();
buildMonthSel();
renderPlanning();
</script>
